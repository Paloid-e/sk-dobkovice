name: Web

# Sestaví web a nasadí ho na GitHub Pages — při pushi na main, nebo ručně
# (Actions → Web → Run workflow). Žádné automatické stahování dat: výsledky a články
# se aktualizují ručně (`node scripts/update.mjs` + commit), automatika poběží až
# na oficiálním hostingu.
#
# Pages musí mít v Settings → Pages → Source nastaveno „GitHub Actions“.
on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/site.test.mjs
      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
