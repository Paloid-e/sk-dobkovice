name: Web

# Sestaví web a nasadí ho na GitHub Pages.
#  - push na main: jen build + deploy
#  - sobota a neděle 19:30 UTC (21:30 SELČ / 20:30 SEČ), jednou denně: nejdřív stáhne
#    výsledky a tabulku z IS FAČR, změněná data commitne, pak build + deploy
#  - ručně: Actions → Web → Run workflow (chová se jako víkendový běh)
#
# Pages musí mít v Settings → Pages → Source nastaveno „GitHub Actions“.
on:
  push:
    branches: [main]
  schedule:
    - cron: "30 19 * * 6,0"
  workflow_dispatch:

permissions:
  contents: write
  pages: write
  id-token: write

concurrency:
  group: web
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: node --test scripts/site.test.mjs

      - name: Stáhnout výsledky a tabulku
        if: github.event_name != 'push'
        run: |
          node scripts/update.mjs
          if git diff --quiet -- data/season.json; then
            echo "Data beze změny."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git commit -m "Aktualizace výsledků a tabulky z fotbal.cz" -- data/season.json
          git push

      - run: node scripts/build.mjs
      - uses: actions/upload-pages-artifact@v3
        with:
          path: dist

  deploy:
    needs: build
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - id: deployment
        uses: actions/deploy-pages@v4
