<!DOCTYPE html>
<html lang="cs">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{title}}</title>
<meta name="description" content="{{description}}">
<script>document.documentElement.classList.add('js');</script>
<link rel="icon" href="{{root}}logo.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Anton&family=Archivo:wght@400;500;600;700;800&family=IBM+Plex+Mono:wght@400;500;600;700&display=swap">
<link rel="stylesheet" href="{{root}}assets/styles.css?v={{css-version}}">
</head>
<body>

<header>
  <div class="wrap header-in">
    <a class="brand" href="{{home}}">
      <img class="crest-sm" src="{{root}}logo.png" alt="Znak SK Dobkovice">
      <span>
        <span class="club-name">SK Dobkovice</span>
        <span class="club-sub">Červenobílí · okres Děčín</span>
      </span>
    </a>
    <nav aria-label="Hlavní navigace">
{{nav}}
    </nav>
  </div>
</header>

<main>
{{content}}
</main>

<footer>
  <div class="wrap footer-in">
    <span>SK Dobkovice, z. s.</span>
    <span>Červenobílí z labského údolí</span>
  </div>
  <div class="wrap credit">
    <span>Web vytvořil</span>
    <a href="https://paloid.info"><img src="https://paloid.info/button.png" alt="paloid.info" width="88" height="31"></a>
  </div>
</footer>

<script src="{{root}}assets/site.js?v={{js-version}}" defer></script>
</body>
</html>
